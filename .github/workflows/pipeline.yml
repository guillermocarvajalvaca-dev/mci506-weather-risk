name: Weather Risk Pipeline

on:
  workflow_dispatch:
    inputs:
      run_transformations:
        description: "Run BigQuery Silver and Gold SQL transformations"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: read

concurrency:
  group: weather-risk-pipeline
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: mci506-weather-risk
  GOOGLE_CLOUD_PROJECT: mci506-weather-risk
  PYTHONUNBUFFERED: "1"

jobs:
  validate-and-run:
    name: Validate and run weather risk pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests if present
        shell: bash
        run: |
          if [ -d "tests" ] && find tests -type f -name "test_*.py" | grep -q .; then
            pytest -q
          else
            echo "No pytest test files found; skipping tests."
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate Google Cloud authentication
        shell: bash
        run: |
          gcloud config set project "$GCP_PROJECT_ID"
          gcloud auth list --filter=status:ACTIVE --format="value(account)"

      - name: Extract Open-Meteo data
        run: python scripts/extract.py

      - name: Load Bronze data to GCS and BigQuery
        run: python scripts/load.py

      - name: Run Silver transformation
        if: ${{ github.event_name == 'schedule' || github.event.inputs.run_transformations == 'true' }}
        run: bq query --project_id="$GCP_PROJECT_ID" --use_legacy_sql=false < sql/silver_transform.sql

      - name: Run Gold daily risk index
        if: ${{ github.event_name == 'schedule' || github.event.inputs.run_transformations == 'true' }}
        run: bq query --project_id="$GCP_PROJECT_ID" --use_legacy_sql=false < sql/gold_daily_risk_index.sql

      - name: Run Gold climate comparative
        if: ${{ github.event_name == 'schedule' || github.event.inputs.run_transformations == 'true' }}
        run: bq query --project_id="$GCP_PROJECT_ID" --use_legacy_sql=false < sql/gold_climate_comparative.sql

      - name: Run Gold extreme events
        if: ${{ github.event_name == 'schedule' || github.event.inputs.run_transformations == 'true' }}
        run: bq query --project_id="$GCP_PROJECT_ID" --use_legacy_sql=false < sql/gold_extreme_events.sql
